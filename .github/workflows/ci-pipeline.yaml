name: ci-pipeline
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: install dependencies
        run: npm ci

      - name: run tests
        run: npm run coverage

      - name: upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
